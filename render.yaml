# Replaces the Railway web and worker tiers.
# Import Railway worker env vars before resuming. No wallet keys in this file.
services:
  - type: web
    name: mimir-web
    runtime: node
    region: ohio
    plan: 1c-2g
    numInstances: 1
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start -- --hostname 0.0.0.0
    healthCheckPath: /api/live
    autoDeployTrigger: 'off'
    envVars:
      - key: NODE_VERSION
        value: '22.19.0'
      - key: DATABASE_URL
        sync: false
      - key: NEXT_PUBLIC_CONTRACT_ADDRESS
        sync: false
      - key: NEXT_PUBLIC_DEPLOY_BLOCK
        sync: false
      - key: NEXT_PUBLIC_BASE_RPC_URL
        sync: false
      - key: NEXT_PUBLIC_PRIVY_APP_ID
        sync: false
      - key: NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID
        sync: false
      - key: SELLER_ADDRESS
        sync: false
      - key: PASS_SECRET
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Import the remaining existing web env, including all public council
      # addresses and feature flags. Agent private keys belong only to workers.
  - type: worker
    name: mimir-workers
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: ohio
    plan: 1c-2g
    numInstances: 1
    autoDeployTrigger: 'off'
    disk:
      name: sibyl-memory
      mountPath: /data
      sizeGB: 1
    envVars:
      # Keep the first deployment idle until Railway is stopped and its SQLite
      # memory has been restored onto /data. Set to 0 to start the fleet.
      - key: WORKERS_START_PAUSED
        value: '1'
      - key: WORKERS_MAX_OLD_SPACE_MB
        value: '768'
      - key: SIBYL_MEMORY_DB
        value: /data/sibyl/memory.db
      - key: SIBYL_VENV
        value: /opt/sibyl-venv
      - key: SIBYL_REQUIRED
        value: '1'
      - key: SIBYL_EVENT_LOG
        value: '0'
      - key: SIBYL_NEON_ARCHIVE
        value: '0'
      - key: DATABASE_URL
        sync: false
      - key: MIMIR_BASE_URL
        fromService:
          type: web
          name: mimir-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: MIMIR_URL
        fromService:
          type: web
          name: mimir-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: BASE_RPC_URL
        sync: false
      - key: NEXT_PUBLIC_CONTRACT_ADDRESS
        sync: false
      - key: ORACLE_PRIVATE_KEY
        sync: false
      - key: CREATOR_PRIVATE_KEY
        sync: false
      # Copy remaining keys, addresses, LLM credentials, flags, deploy block,
      # council/trader settings and optional ACP credentials from Railway.
