providers = ["node"]

# Pin Node 22 for Railway / any Nixpacks-driven CI.
# Python is required so workers can run the real sibyl-memory-client sidecar.
# The x402 v2 SDKs (@x402/core, @x402/evm, @x402/next) target Node 22, and our
# agent scripts use `tsx --env-file-if-exists`.
[phases.setup]
nixPkgs = ["nodejs_22", "npm-10_x", "python313", "python313Packages.pip"]

[phases.install]
cmds = [
  "npm ci",
]
